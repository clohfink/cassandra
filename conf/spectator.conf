// Netflix internal overrides to
// https://github.com/Netflix/spectator/blob/main/spectator-ext-jvm/src/main/resources/cassandra.conf
netflix.spectator.agent.jmx.mappings = ${?netflix.spectator.agent.jmx.mappings} [
  {
    query = "org.apache.cassandra.metrics:type=*ColumnFamily,name=UnrepairedAgeInSeconds,keyspace=*,*"
    measurements = [
      {
        name = "cass.cf.{name}"
        tags = [
          {
            key = "scope"
            value = "{scope}"
          },
          {
            key = "keyspace"
            value = "{keyspace}"
          },
          {
            key = "atlas.dstype"
            value = "gauge"
          }
        ]
        value = "{Value}"
      }
    ]
  },

  {
    query = "org.apache.cassandra.metrics:type=*ColumnFamily,name=*ReadSize,keyspace=*,*"
    measurements = [
      {
        name = "cass.cf.{name}"
        tags = [
          {
            key = "scope"
            value = "{scope}"
          },
          {
            key = "keyspace"
            value = "{keyspace}"
          },
          {
            key = "familyType"
            value = "{type}"
          },
          {
            key = "statistic"
            value = "count"
          },
          {
            key = "atlas.dstype"
            value = "rate"
          }
        ]
        value = "{OneMinuteRate}"
      },
      {
        name = "cass.cf.{name}"
        tags = [
          {
            key = "scope"
            value = "{scope}"
          },
          {
            key = "keyspace"
            value = "{keyspace}"
          },
          {
            key = "familyType"
            value = "{type}"
          },
          {
            key = "statistic"
            value = "max"
          },
          {
            key = "atlas.dstype"
            value = "gauge"
          }
        ]
        value = "{Max}"
      },
      {
        name = "cass.cf.{name}"
        tags = [
          {
            key = "scope"
            value = "{scope}"
          },
          {
            key = "keyspace"
            value = "{keyspace}"
          },
          {
            key = "familyType"
            value = "{type}"
          },
          {
            key = "statistic"
            value = "totalTime"
          },
          {
            key = "atlas.dstype"
            value = "rate"
          }
        ]
        value = "{50thPercentile},{OneMinuteRate},:mul,{Count},{previous:Count},:if-changed"
      },
      {
        name = "cass.cf.{name}"
        tags = [
          {
            key = "scope"
            value = "{scope}"
          },
          {
            key = "keyspace"
            value = "{keyspace}"
          },
          {
            key = "familyType"
            value = "{type}"
          },
          {
            key = "statistic"
            value = "percentile_50"
          },
          {
            key = "atlas.dstype"
            value = "gauge"
          }
        ]
        value = "{50thPercentile},{Count},{previous:Count},:if-changed"
      },
      {
        name = "cass.cf.{name}"
        tags = [
          {
            key = "scope"
            value = "{scope}"
          },
          {
            key = "keyspace"
            value = "{keyspace}"
          },
          {
            key = "familyType"
            value = "{type}"
          },
          {
            key = "statistic"
            value = "percentile_95"
          },
          {
            key = "atlas.dstype"
            value = "gauge"
          }
        ]
        value = "{95thPercentile},{Count},{previous:Count},:if-changed"
      },
      {
        name = "cass.cf.{name}"
        tags = [
          {
            key = "scope"
            value = "{scope}"
          },
          {
            key = "keyspace"
            value = "{keyspace}"
          },
          {
            key = "familyType"
            value = "{type}"
          },
          {
            key = "statistic"
            value = "percentile_99"
          },
          {
            key = "atlas.dstype"
            value = "gauge"
          }
        ]
        value = "{99thPercentile},{Count},{previous:Count},:if-changed"
      },
      {
        name = "cass.cf.{name}"
        tags = [
          {
            key = "scope"
            value = "{scope}"
          },
          {
            key = "keyspace"
            value = "{keyspace}"
          },
          {
            key = "familyType"
            value = "{type}"
          },
          {
            key = "statistic"
            value = "percentile_99.9"
          },
          {
            key = "atlas.dstype"
            value = "gauge"
          }
        ]
        value = "{999thPercentile},{Count},{previous:Count},:if-changed"
      }
    ]
  },

  {
    query = "org.apache.cassandra.metrics:type=Messaging,name=*-Latency"
    measurements = [
      {
        name = "cass.messaging.{name}"
        tags = [
          {
            key = "statistic"
            value = "count"
          },
          {
            key = "atlas.dstype"
            value = "rate"
          }
        ]
        value = "{OneMinuteRate}"
      },
      {
        name = "cass.messaging.{name}"
        tags = [
          {
            key = "statistic"
            value = "max"
          },
          {
            key = "atlas.dstype"
            value = "gauge"
          }
        ]
        value = "{Max},1e6,:div"
      },
      {
        name = "cass.messaging.{name}"
        tags = [
          {
            key = "statistic"
            value = "totalTime"
          },
          {
            key = "atlas.dstype"
            value = "rate"
          }
        ]
        value = "{50thPercentile},1e6,:div,{OneMinuteRate},:mul,{Count},{previous:Count},:if-changed"
      },
      {
        name = "cass.messaging.{name}"
        tags = [
          {
            key = "statistic"
            value = "percentile_50"
          },
          {
            key = "atlas.dstype"
            value = "gauge"
          }
        ]
        value = "{50thPercentile},1e6,:div,{Count},{previous:Count},:if-changed"
      },
      {
        name = "cass.messaging.{name}"
        tags = [
          {
            key = "statistic"
            value = "percentile_95"
          },
          {
            key = "atlas.dstype"
            value = "gauge"
          }
        ]
        value = "{95thPercentile},1e6,:div,{Count},{previous:Count},:if-changed"
      },
      {
        name = "cass.messaging.{name}"
        tags = [
          {
            key = "statistic"
            value = "percentile_99"
          },
          {
            key = "atlas.dstype"
            value = "gauge"
          }
        ]
        value = "{99thPercentile},1e6,:div,{Count},{previous:Count},:if-changed"
      },
      {
        name = "cass.messaging.{name}"
        tags = [
          {
            key = "statistic"
            value = "percentile_99.9"
          },
          {
            key = "atlas.dstype"
            value = "gauge"
          }
        ]
        value = "{999thPercentile},1e6,:div,{Count},{previous:Count},:if-changed"
      }
    ]
  },

  {
    query = "org.apache.cassandra.net:type=Gossiper"
    measurements = [
      {
        name = "cass.health.schemaCount"
        tags = [
          {
            key = "atlas.dstype"
            value = "gauge"
          }
        ]
        value = "{SchemaVersionCount}"
      }
      {
        name = "cass.health.tokensState"
        tags = [
          {
            key = "atlas.dstype"
            value = "gauge"
          }
        ]
        value = "{TokenOwnershipHash}"
      }
    ]
  },

   {
      query = "org.apache.cassandra.metrics:type=Resources,name=CpuDelay"
      measurements = [
        {
          name = "cass.schedstat.delay"
          tags = [
            {
              key = "atlas.dstype"
              value = "gauge"
            }
          ]
          value = "{Value}"
        }
      ]
    },

  {
    query = "org.apache.cassandra.metrics:type=LogbackMetrics,name=*"
    measurements = [
      {
        name = "cass.logging.{name}"
        tags = [
          {
            key = "atlas.dstype"
            value = "counter"
          }
        ]
        value = "{Count}"
      }
    ]
  },
  {
     query = "org.apache.cassandra.metrics:type=ClientMessageSize,name=BytesReceived"
     measurements = [
       {
           name = "cass.messaging.{name}"
           tags = [
             {
               key = "atlas.dstype"
               value = "gauge"
             }
           ]
           value = "{Count}"
       }
     ]
   },
   {
    query = "org.apache.cassandra.metrics:type=ClientMessageSize,name=BytesSent"
    measurements = [
      {
          name = "cass.messaging.{name}"
          tags = [
            {
              key = "atlas.dstype"
              value = "gauge"
            }
          ]
          value = "{Count}"
      }
    ]
   },
   {
    query = "org.apache.cassandra.metrics:type=ClientMessageSize,name=BytesReceivedPerRequest"
    measurements = [
        {
          name = "cass.messaging.{name}"
          tags = [
            {
              key = "statistic"
              value = "max"
            },
            {
              key = "atlas.dstype"
              value = "gauge"
            }
          ]
          value = "{Max},1e6,:div"
        },
        {
          name = "cass.messaging.{name}"
          tags = [
            {
              key = "statistic"
              value = "percentile_50"
            },
            {
              key = "atlas.dstype"
              value = "gauge"
            }
          ]
          value = "{50thPercentile},1e6,:div,{Count},{previous:Count},:if-changed"
        },
        {
          name = "cass.messaging.{name}"
          tags = [
            {
              key = "statistic"
              value = "percentile_95"
            },
            {
              key = "atlas.dstype"
              value = "gauge"
            }
          ]
          value = "{95thPercentile},1e6,:div,{Count},{previous:Count},:if-changed"
        },
        {
          name = "cass.messaging.{name}"
          tags = [
            {
              key = "statistic"
              value = "percentile_99"
            },
            {
              key = "atlas.dstype"
              value = "gauge"
            }
          ]
          value = "{99thPercentile},1e6,:div,{Count},{previous:Count},:if-changed"
        },
        {
          name = "cass.messaging.{name}"
          tags = [
            {
              key = "statistic"
              value = "percentile_99.9"
            },
            {
              key = "atlas.dstype"
              value = "gauge"
            }
          ]
          value = "{999thPercentile},1e6,:div,{Count},{previous:Count},:if-changed"
        }
    ]
   },
   {
    query = "org.apache.cassandra.metrics:type=ClientMessageSize,name=BytesSentPerResponse"
    measurements = [
       {
         name = "cass.messaging.{name}"
         tags = [
           {
             key = "statistic"
             value = "max"
           },
           {
             key = "atlas.dstype"
             value = "gauge"
           }
         ]
         value = "{Max},1e6,:div"
       },
       {
         name = "cass.messaging.{name}"
         tags = [
           {
             key = "statistic"
             value = "percentile_50"
           },
           {
             key = "atlas.dstype"
             value = "gauge"
           }
         ]
         value = "{50thPercentile},1e6,:div,{Count},{previous:Count},:if-changed"
       },
       {
         name = "cass.messaging.{name}"
         tags = [
           {
             key = "statistic"
             value = "percentile_95"
           },
           {
             key = "atlas.dstype"
             value = "gauge"
           }
         ]
         value = "{95thPercentile},1e6,:div,{Count},{previous:Count},:if-changed"
       },
       {
         name = "cass.messaging.{name}"
         tags = [
           {
             key = "statistic"
             value = "percentile_99"
           },
           {
             key = "atlas.dstype"
             value = "gauge"
           }
         ]
         value = "{99thPercentile},1e6,:div,{Count},{previous:Count},:if-changed"
       },
       {
         name = "cass.messaging.{name}"
         tags = [
           {
             key = "statistic"
             value = "percentile_99.9"
           },
           {
             key = "atlas.dstype"
             value = "gauge"
           }
         ]
         value = "{999thPercentile},1e6,:div,{Count},{previous:Count},:if-changed"
       }
    ]
   }
]

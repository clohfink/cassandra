buildscript {
    dependencies {
        classpath 'com.gradleup.shadow:shadow-gradle-plugin:8.3.9'
    }
}

apply plugin: 'netflix.nebula'
apply plugin: 'netflix.ospackage'
apply plugin: 'java'
apply plugin: 'maven-publish'
apply plugin: 'com.gradleup.shadow'

buildscript {
    repositories {
        maven { url 'https://artifacts.netflix.net/maven2' }
        gradlePluginPortal()
    }
    dependencies {
        classpath 'com.google.cloud.tools:jib-gradle-plugin:3.4.4'
    }
}
apply plugin: 'com.google.cloud.tools.jib'

nebula {
    moduleEmail = 'ods-team@netflix.com'
    moduleOwner = 'ods-team@netflix.com'
}

compileJava.enabled = false
compileTestJava.enabled = false
shadowJar.enabled = false

// Remove the shadow variant from the Java component. The Shadow plugin automatically registers
// the shadowJar output as a variant, but since shadowJar is disabled, publishBuildInfoToArtifactory
// tries to checksum the non-existent -all.jar and fails.
afterEvaluate {
    components.java {
        withVariantsFromConfiguration(configurations.shadowRuntimeElements) { skip() }
    }
}

ant.importBuild('build.xml') { antTargetName ->
    'ant' + antTargetName
}

ext {
    pname = "cde-nfcassandra-40x"
    cass_version = ant.properties['version']
    cass_home_dir = "/apps/nfcassandra_server"
    cass_filename = "nf-cassandra-${project.ext.cass_version}-bin.tar.gz"
    //priam_extensions_version = "3.11.52"
    priam_extensions_version = "4.1.3"
    priam_extensions_jar = "priam-cass-extensions-${priam_extensions_version}.jar"
    jibExtraDir = "${buildDir}/jib-extra"
}

dependencies {
    implementation "com.netflix.priam:priam-cass-extensions:${priam_extensions_version}"
    implementation 'software.amazon.cryptools:AmazonCorrettoCryptoProvider:2.3.3:linux-x86_64'
    implementation 'netflix:nfcassandra-authn-authz-lib-4.x:2.0.4'
}

task unpackTarball(type: Copy, dependsOn: antartifacts) {
    from tarTree(layout.buildDirectory.file(project.ext.cass_filename).get().asFile)
    into layout.buildDirectory.dir("tarball").get().asFile
}

task copyFromTarball(type: Copy, dependsOn: unpackTarball) {
    from layout.buildDirectory.dir("tarball/nf-cassandra-${project.ext.cass_version}").get().asFile
    into "root/${project.ext.cass_home_dir}"

    exclude "javadoc/**"
    exclude "conf/**"

    rename('cassandra.in.sh', 'cassandra.in.sh.upstream')
}

task copyConfig(type: Copy, dependsOn: copyFromTarball) {
    from layout.buildDirectory.dir("tarball/nf-cassandra-${project.ext.cass_version}/conf").get().asFile
    into "root/etc/cassandra"

    rename('cassandra-topology.properties', 'cassandra-topology.properties.upstream')
}

task customizeFiles(type: Copy, dependsOn: copyConfig) {
    from "nflx-packaging"
    into "root"
}


buildDeb {
    dependsOn customizeFiles
}

ospackage {
    packageName = project.ext.pname
    version = project.ext.cass_version

    println "Building deb for nf-cassandra ${version}"
    into("${project.ext.cass_home_dir}/lib") {
        from configurations.runtimeClasspath.filter { it.name.startsWith('priam') }
        from configurations.runtimeClasspath.filter { it.name.startsWith('AmazonCorrettoCryptoProvider') }
        from configurations.runtimeClasspath.filter { it.name.startsWith('nfcassandra-authn-authz-lib') }
        from configurations.runtimeClasspath.filter { it.name.startsWith('metatron-sign') }
        from configurations.runtimeClasspath.filter { it.name.startsWith('bcprov-jdk15on') }
        from configurations.runtimeClasspath.filter { it.name.startsWith('authorizable-context') }
        from configurations.runtimeClasspath.filter { it.name.startsWith('gandalf-authz-client-shaded') }
        from configurations.runtimeClasspath.filter { it.name.startsWith('nflx-e2etokens-common') }
        from configurations.runtimeClasspath.filter { it.name.startsWith('nflx-e2etokens-validation') }
        from configurations.runtimeClasspath.filter { it.name.startsWith('nflx-e2etokens-validation-spring') }
        from configurations.runtimeClasspath.filter { it.name.startsWith('spectator-api') }
    }

    // For external packages that depend on Cassandra to be installed but do not care which particular version
    provides('cdecassandra')

    link("${project.ext.cass_home_dir}/agents/${priam_extensions_jar}",
        "${project.ext.cass_home_dir}/lib/${priam_extensions_jar}")
    link("/usr/share/cassandra/cassandra.in.sh",
        "${project.ext.cass_home_dir}/bin/cassandra.in.sh")

    link("${project.ext.cass_home_dir}/conf", '/etc/cassandra')
    postInstall file('./postInstall.sh')
}

//nebula disables debian indexing by default since 9.1.1. We now need to explicitly enable it to make our deb discoverable
tasks.named('buildDebPublish').configure {
    enableIndexing = true
}

java {
    toolchain {
        //this selection controlls which JDK is installed on the machine toghether with cassandra package
        languageVersion = JavaLanguageVersion.of(21)
    }
}

// ---------------------------------------------------------------------------
// Jib container image staging and configuration
// ---------------------------------------------------------------------------

// Netflix lib prefixes shared between ospackage and jib staging
ext.nflxLibPrefixes = [
    'AmazonCorrettoCryptoProvider', 'nfcassandra-authn-authz-lib',
    'metatron-sign', 'bcprov-jdk15on', 'authorizable-context',
    'gandalf-authz-client-shaded', 'nflx-e2etokens-common',
    'nflx-e2etokens-validation', 'nflx-e2etokens-validation-spring',
    'spectator-api'
]

task stageJibDistribution(type: Copy, dependsOn: customizeFiles) {
    description 'Copy the assembled root/ distribution into the Jib extra-directory staging area'
    from 'root'
    into "${project.ext.jibExtraDir}"
}

task stageJibNetflixLibs(type: Copy, dependsOn: stageJibDistribution) {
    description 'Copy Netflix dependency JARs into the staged lib directory'
    into "${project.ext.jibExtraDir}${project.ext.cass_home_dir}/lib"
    project.ext.nflxLibPrefixes.each { prefix ->
        from configurations.runtimeClasspath.filter { it.name.startsWith(prefix) }
    }
}

task stageJibPythonDeps(type: Exec, dependsOn: stageJibDistribution) {
    description 'Install Python metatron library and dependencies into pylib for cqlsh'
    def pylibDir = "${project.ext.jibExtraDir}${project.ext.cass_home_dir}/pylib"
    commandLine 'python3', '-m', 'pip', 'install',
        '--target', pylibDir,
        '--index-url', 'https://pypi.netflix.net/simple',
        'metatron'
    doFirst {
        file(pylibDir).mkdirs()
    }
}

task stageJibPythonTransitiveDeps(type: Exec, dependsOn: stageJibPythonDeps) {
    description 'Install transitive Python dependencies for metatron'
    def pylibDir = "${project.ext.jibExtraDir}${project.ext.cass_home_dir}/pylib"
    commandLine 'python3', '-m', 'pip', 'install',
        '--target', pylibDir,
        '--index-url', 'https://pypi.netflix.net/simple',
        'pyOpenSSL', 'cryptography', 'pyasn1_modules'
}

task stageJibSymlinksAndDirs(dependsOn: [stageJibNetflixLibs, stageJibPythonTransitiveDeps]) {
    description 'Create data mount-point directories and copy the docker entrypoint script'
    doLast {
        // Docker entrypoint script
        copy {
            from 'bin/docker-entrypoint.sh'
            into project.ext.jibExtraDir
        }
    }
}

task stageJib {
    description 'Umbrella task that ensures the full Jib staging area is ready'
    dependsOn stageJibSymlinksAndDirs
}

jib {
    from {
        image = 'dockerregistry.test.netflix.net:7002/cde/dgw-base-java21-jib:latest'
    }
    to {
        image = 'cde-nfcassandra'
        tags = [project.version, 'latest']
    }
    container {
        entrypoint = ['/docker-entrypoint.sh', project.ext.cass_home_dir + '/bin/cassandra', '-f', '-R']
        ports = ['7101', '7103', '7104']
        environment = [
            'CASSANDRA_HOME': project.ext.cass_home_dir,
            'CASSANDRA_LOG_DIR': '/mnt/data/cassandra/logs'
        ]
        user = 'root'
    }
    extraDirectories {
        paths {
            path {
                setFrom(project.ext.jibExtraDir.toString())
                into = '/'
            }
        }
        permissions = [
            '/docker-entrypoint.sh'                                    : '755',
            (project.ext.cass_home_dir + '/bin/**')                    : '755',
            (project.ext.cass_home_dir + '/tools/bin/**')              : '755'
        ]
    }
    containerizingMode = 'packaged'
}

// Wire Jib tasks to depend on staging
tasks.matching { it.name.startsWith('jib') && it.name != 'jibDockerBuild' && it.name != 'jibBuildTar' }.configureEach {
    dependsOn stageJib
}
['jib', 'jibDockerBuild', 'jibBuildTar'].each { taskName ->
    tasks.named(taskName).configure {
        dependsOn stageJib
    }
}

// Jib requires the project JAR to exist even though we only use extraDirectories.
// Since compileJava is disabled, jar produces an empty JAR — which is fine.
tasks.named('jar').configure {
    dependsOn stageJib
}

// Build container image as part of the publish lifecycle
tasks.named('publish').configure {
    dependsOn jibDockerBuild
}

// Compute dtest JAR version. Used by both the shaded fat JAR and the bootstrap JAR.
// - Tag builds (ROCKET_TAG=v4.1.139): use the tag stripped of 'v' prefix -> 4.1.139
// - CI builds: use {base.version}.{BUILD_NUMBER} -> 4.1.8.915
// - Local builds: use {base.version}.local
ext.dtestVersion = {
    String rocketTag = System.getenv('ROCKET_TAG')
    if (rocketTag != null && rocketTag.matches('^v4\\.1\\.\\d+$')) {
        return rocketTag.replaceFirst('^v', '')
    }
    return "${ant.properties['base.version']}.${System.getenv('BUILD_NUMBER') ?: 'local'}"
}.call()

// ---------------------------------------------------------------------------
// jvm-dtest bootstrap JAR: Gradle plugin + DtestClusterFactory
// ---------------------------------------------------------------------------
// Published as com.netflix.cde:nfcassandra-jvm-dtest-bootstrap:<version>.
// Contains the Gradle plugin, DtestClusterFactory (classloader isolation),
// and logback-dtest.xml. Consumers apply the plugin and get pre-configured
// JVM args, system properties, and classpath setup.

sourceSets {
    bootstrap {
        java.srcDir 'src/bootstrap/java'
        resources.srcDir 'src/bootstrap/resources'
    }
}

dependencies {
    bootstrapImplementation 'org.apache.cassandra:dtest-api:0.0.18'
    bootstrapCompileOnly gradleApi()
}

tasks.register('bootstrapJar', Jar) {
    from sourceSets.bootstrap.output
    archiveBaseName = 'nfcassandra-jvm-dtest-bootstrap'
    archiveVersion = project.ext.dtestVersion
    manifest {
        attributes('Implementation-Version': project.ext.dtestVersion)
    }
}

// ---------------------------------------------------------------------------
// jvm-dtest JAR: build, shade, verify, and publish
// ---------------------------------------------------------------------------
// Publishes com.netflix.cde:nfcassandra-jvm-dtest:<version> to Artifactory.
// Version scheme: {base.version}.{BUILD_NUMBER}, e.g. 4.1.8.911
// Runs as part of ./gradlew publish (triggered by the build-artifacts Jenkins job).
//
// The chain: buildDtestJar (forks to ant) -> shadeDtestJar (relocates AWS SDK)
//         -> verifyShadedDtestJar (asserts no unrelocated classes) -> publish

import com.github.jengelman.gradle.plugins.shadow.tasks.ShadowJar

// dtestVersion is defined earlier, before the bootstrap section

// Build the dtest fat JAR by launching Ant as a Java subprocess using the Ant JARs
// bundled with the Gradle distribution. We can't use the imported Ant targets (antdtest-jar)
// because ant.importBuild evaluates Ant <condition> properties at Gradle configuration time
// and caches them as immutable. After ./gradlew clean deletes build/, the cached property
// maven-ant-tasks.jar.exists is still 'true' so the download is skipped and the build fails.
// A fresh Ant process re-evaluates all conditions correctly.
tasks.register('buildDtestJar', JavaExec) {
    def gradleHome = gradle.gradleHomeDir
    def antJars = fileTree(gradleHome) { include 'lib/ant-launcher-*.jar', 'lib/ant-1*.jar' }
    classpath = antJars
    mainClass = 'org.apache.tools.ant.launch.Launcher'
    args = ['-f', file('build.xml').absolutePath, 'dtest-jar']
    workingDir projectDir
    outputs.file(layout.buildDirectory.file("dtest-${ant.properties['base.version']}.jar").get().asFile)

    doFirst {
        logger.lifecycle("buildDtestJar: Gradle home: ${gradleHome}")
        logger.lifecycle("buildDtestJar: Ant JARs: ${antJars.files.collect { it.name }}")
        logger.lifecycle("buildDtestJar: JAVA_HOME: ${System.getenv('JAVA_HOME') ?: 'not set'}")
        logger.lifecycle("buildDtestJar: Java version: ${System.getProperty('java.version')}")
        logger.lifecycle("buildDtestJar: build.xml: ${file('build.xml').absolutePath}")
        assert !antJars.empty : "No Ant JARs found in ${gradleHome}/lib/ — Gradle distribution may be incomplete"
    }
}

// Shade the dtest JAR to relocate the AWS SDK, avoiding classpath conflicts with consumers.
tasks.register('shadeDtestJar', ShadowJar) {
    dependsOn 'buildDtestJar'
    def dtestJar = layout.buildDirectory.file("dtest-${ant.properties['base.version']}.jar").get().asFile
    from({ zipTree(dtestJar) })
    archiveBaseName = 'nfcassandra-jvm-dtest'
    archiveVersion = project.ext.dtestVersion
    archiveClassifier = ''
    destinationDirectory = layout.buildDirectory.dir("dtest-shaded").get().asFile

    // Strip JAR signature files from bundled dependencies (e.g. ECJ's ECLIPSE_.SF/.RSA).
    // Shading invalidates signatures, and consumers loading the fat JAR via URLClassLoader
    // get SecurityException if stale signatures are present.
    exclude 'META-INF/*.SF'
    exclude 'META-INF/*.RSA'
    exclude 'META-INF/*.DSA'

    relocate('software.amazon', 'relocated.software.amazon') {
        exclude 'software.amazon.awssdk.crt.**'
    }

    doFirst {
        logger.lifecycle("shadeDtestJar: Input JAR: ${dtestJar} (${dtestJar.length() / 1024 / 1024} MB)")
        logger.lifecycle("shadeDtestJar: Relocating software.amazon -> relocated.software.amazon")
    }
    doLast {
        logger.lifecycle("shadeDtestJar: Produced ${archiveFile.get().asFile} (${archiveFile.get().asFile.length() / 1024 / 1024} MB)")
    }
}

// Verify the shaded JAR is safe for consumers:
//  1. No unrelocated AWS SDK classes (would cause classpath conflicts with consumer's SDK version)
//  2. No relocated JNI classes whose native methods won't resolve
//
// JNI native methods are resolved by symbol name derived from the fully qualified class name.
// For example, the Java class software.amazon.awssdk.crt.CRT declaring native void awsCrtInit()
// expects the symbol Java_software_amazon_awssdk_crt_CRT_awsCrtInit in the native library.
// If the Shadow plugin relocates that class to relocated.software.amazon.awssdk.crt.CRT, the
// JVM looks for Java_relocated_software_amazon_awssdk_crt_CRT_awsCrtInit — which doesn't exist
// in the bundled .so/.dylib, causing UnsatisfiedLinkError at runtime.
//
// This task extracts relocated classes from the shaded JAR and uses javap to find any that
// declare native methods. If found, the build fails — those classes must be excluded from
// relocation. Only relocated/ classes are checked since those are the ones the Shadow plugin
// may have broken; the original classes retain their correct JNI symbol mapping.
tasks.register('verifyShadedDtestJar') {
    dependsOn 'shadeDtestJar'
    doLast {
        def jar = tasks.shadeDtestJar.archiveFile.get().asFile

        // 1. No unrelocated AWS SDK classes, except CRT which must stay unrelocated for JNI.
        def conflicts = zipTree(jar).matching {
            include 'software/amazon/**/*.class'
            exclude 'software/amazon/awssdk/crt/**'
        }.files
        assert conflicts.isEmpty() :
            "Found ${conflicts.size()} unrelocated AWS SDK classes in ${jar.name}. " +
            "These will cause classpath conflicts for consumers."
        logger.lifecycle("verifyShadedDtestJar: Verified — 0 unrelocated AWS SDK classes (excluding CRT)")

        // 2. No relocated classes with native methods (JNI symbol mismatch check).
        //    Scan the JAR directly using ASM (bundled with Gradle) to check for the ACC_NATIVE
        //    flag on methods in relocated classes. No extraction or subprocesses needed.
        def nativeClasses = [] as Set
        new java.util.zip.ZipFile(jar).withCloseable { zf ->
            zf.entries().findAll { it.name.startsWith('relocated/') && it.name.endsWith('.class') }.each { entry ->
                zf.getInputStream(entry).withCloseable { is ->
                    def reader = new org.objectweb.asm.ClassReader(is)
                    def className = reader.className.replace('/', '.')
                    reader.accept(new org.objectweb.asm.ClassVisitor(org.objectweb.asm.Opcodes.ASM9) {
                        @Override
                        org.objectweb.asm.MethodVisitor visitMethod(int access, String name, String descriptor, String signature, String[] exceptions) {
                            if ((access & org.objectweb.asm.Opcodes.ACC_NATIVE) != 0) {
                                nativeClasses.add(className)
                            }
                            return null
                        }
                    }, org.objectweb.asm.ClassReader.SKIP_CODE | org.objectweb.asm.ClassReader.SKIP_DEBUG | org.objectweb.asm.ClassReader.SKIP_FRAMES)
                }
            }
        }
        if (!nativeClasses.isEmpty()) {
            throw new GradleException(
                "Found ${nativeClasses.size()} relocated class(es) with native methods.\n" +
                "These will fail at runtime with UnsatisfiedLinkError because the bundled native\n" +
                "libraries register JNI symbols under the original (unrelocated) class names.\n" +
                "Fix: exclude the affected packages from the relocate block in shadeDtestJar.\n" +
                "Classes:\n  " + nativeClasses.sort().take(10).join('\n  ') +
                (nativeClasses.size() > 10 ? "\n  ... and ${nativeClasses.size() - 10} more" : ''))
        }
        logger.lifecycle("verifyShadedDtestJar: Verified — no relocated classes with native methods")
    }
}

// Publish the shaded JAR as com.netflix.cde:nfcassandra-jvm-dtest:<version>.
// Uses Ivy publication to piggyback on the existing Nebula Ivy upload path to
// libs-snapshots-local, which is the only remote Artifactory repo configured for
// this project. Consumers resolve it via Gradle's standard dependency syntax.
afterEvaluate {
    publishing {
        publications {
            jvmDtestIvy(IvyPublication) {
                organisation = 'com.netflix.cde'
                module = 'nfcassandra-jvm-dtest'
                revision = project.ext.dtestVersion
                artifact(tasks.named('shadeDtestJar'))

                descriptor.description {
                    text = 'Fat JAR for running Cassandra jvm-dtest (in-JVM distributed tests). Contains all Cassandra classes, test infrastructure, and bundled dependencies. AWS SDK is relocated to avoid classpath conflicts.'
                }
            }
            jvmDtestBootstrapIvy(IvyPublication) {
                organisation = 'com.netflix.cde'
                module = 'nfcassandra-jvm-dtest-bootstrap'
                revision = project.ext.dtestVersion
                artifact(tasks.named('bootstrapJar'))

                descriptor.description {
                    text = 'Gradle plugin and DtestClusterFactory for jvm-dtest classloader isolation. Apply the com.netflix.cde.cassandra-jvm-dtest-bootstrap plugin and use the cassandraJvmDtest extension.'
                }
            }
        }
    }

    // Wire verification and create convenience task.
    // Find the actual task name at runtime since it depends on which repos Nebula configured.
    tasks.matching { it.name.startsWith('publishJvmDtestIvy') && it.name.contains('Repository') }.configureEach {
        dependsOn 'verifyShadedDtestJar'
    }

    tasks.register('publishJvmDtest') {
        dependsOn tasks.matching {
            (it.name.startsWith('publishJvmDtestIvy') || it.name.startsWith('publishJvmDtestBootstrapIvy')) &&
            it.name.contains('Repository')
        }
    }
}

// ---------------------------------------------------------------------------
// Local multi-node cluster:  ./gradlew cassRun
//
// Builds Cassandra + the container image (jibDockerBuild), renders per-node configs from
// local/cass-template.yaml into local/<node>/{conf,data,commitlog,saved_caches}, generates
// local/cluster-compose.yml, and starts a 3-node cluster. A bundled token-service container
// hands each node its assigned (balanced Murmur3) token. Nodes mimic app cass_local in
// region us-east-1 across racks 1a/1b/1c. See RUNNING_LOCALLY.md.
// ---------------------------------------------------------------------------
ext.localCluster = [
    name       : 'nfcassandra-cluster',
    subnet     : '172.20.0.0/16',
    app        : 'cass_local',
    env        : 'local',
    region     : 'us-east-1',
    tokenIp    : '172.20.0.10',
    composeFile: "${rootDir}/local/cluster-compose.yml",
    // Balanced single-token Murmur3 ring for 3 nodes; racks 1a/1b/1c in dc us-east-1.
    nodes      : [
        [name: 'node1', ip: '172.20.0.11', port: 7011, token: '-9223372036854775808', az: 'us-east-1a', rack: '1a'],
        [name: 'node2', ip: '172.20.0.12', port: 7012, token: '-3074457345618258603', az: 'us-east-1b', rack: '1b'],
        [name: 'node3', ip: '172.20.0.13', port: 7013, token: '3074457345618258602',  az: 'us-east-1c', rack: '1c'],
    ],
]

tasks.register('cassRenderConfigs') {
    description 'Render per-node configs and the cluster compose file for ./gradlew cassRun'
    group 'local cluster'
    doLast {
        def c = project.ext.localCluster
        def localDir = file("${rootDir}/local")
        def template = file("${localDir}/cass-template.yaml").text

        c.nodes.each { n ->
            def home = "${localDir}/${n.name}"
            ['data', 'commitlog', 'saved_caches', 'conf'].each { d -> mkdir("${home}/${d}") }
            file("${home}/conf/cassandra.yaml").text = template.replace('@NODE_LISTEN_ADDRESS@', n.ip)
            file("${home}/conf/cassandra-rackdc.properties").text = "dc=${c.region}\nrack=${n.rack}\n"
        }

        // Token-service container entrypoint: one --node per member (each gets its own port).
        def tokenArgs = ['"java"', '"/work/LocalTokenServer.java"',
                         '"--app"', "\"${c.app}\"", '"--env"', "\"${c.env}\"", '"--region"', "\"${c.region}\""]
        c.nodes.each { n ->
            tokenArgs << '"--node"'
            tokenArgs << "\"id=${n.name},port=${n.port},ip=${n.ip},token=${n.token},az=${n.az}\""
        }

        def sb = new StringBuilder()
        sb << "# GENERATED by ./gradlew cassRenderConfigs — do not edit. Edit local/cass-template.yaml\n"
        sb << "# or the localCluster spec in build.gradle, then re-run ./gradlew cassRun.\n"
        sb << "name: ${c.name}\n\nservices:\n"

        // Token + swappie service (its own container, separate from the cass nodes).
        sb << "  tokenserver:\n"
        sb << "    image: eclipse-temurin:21-jdk\n"
        sb << "    container_name: nfcass-tokenserver\n"
        sb << "    working_dir: /work\n"
        sb << "    volumes:\n      - ./LocalTokenServer.java:/work/LocalTokenServer.java:ro\n"
        sb << "    entrypoint: [${tokenArgs.join(', ')}]\n"
        sb << "    networks:\n      cass:\n        ipv4_address: ${c.tokenIp}\n"
        sb << "    ports:\n"
        c.nodes.each { n -> sb << "      - \"${n.port}:${n.port}\"\n" }

        // Cassandra nodes. node1 comes up first; node2/node3 wait for it (clean ring formation).
        c.nodes.eachWithIndex { n, idx ->
            int nativeHostPort = 7104 + idx   // host -> container 7104 (cqlsh)
            int jmxPort = 7501 + idx          // host == container (1:1) so JMX RMI traverses NAT
            sb << "  ${n.name}:\n"
            sb << "    image: cde-nfcassandra:latest\n"
            sb << "    platform: linux/amd64\n"
            sb << "    container_name: nfcass-${n.name}\n"
            sb << "    depends_on:\n      tokenserver:\n        condition: service_started\n"
            if (idx > 0)
                sb << "      ${c.nodes[0].name}:\n        condition: service_healthy\n"
            sb << "    environment:\n"
            sb << "      CASSANDRA_LOCAL_MODE: \"true\"\n"
            sb << "      NETFLIX_ENVIRONMENT: ${c.env}\n"
            sb << "      NETFLIX_REGION: ${c.region}\n"
            sb << "      NETFLIX_APP: ${c.app}\n"
            sb << "      NETFLIX_INSTANCE_ID: ${n.name}\n"
            sb << "      NETFLIX_RUNUSER: root\n"
            sb << "      NETFLIX_COMMONGROUP: root\n"
            sb << "      CASSANDRA_TOKEN_SERVICE_URL: http://tokenserver:${n.port}\n"
            sb << "      CASSANDRA_SWAPPIE_URL: http://tokenserver:${n.port}\n"
            sb << "      MAX_HEAP_SIZE: 1G\n"
            sb << "      HEAP_NEWSIZE: 200M\n"
            sb << "      JMX_PORT: \"${jmxPort}\"\n"
            sb << "    networks:\n      cass:\n        ipv4_address: ${n.ip}\n"
            sb << "    ports:\n"
            sb << "      - \"${nativeHostPort}:7104\"\n"
            sb << "      - \"${jmxPort}:${jmxPort}\"\n"
            sb << "    volumes:\n"
            sb << "      - ./${n.name}/conf:/var/lib/nflx-configs/out/cassandra:ro\n"
            sb << "      - ./${n.name}/data:/mnt/data/cassandra/data\n"
            sb << "      - ./${n.name}/commitlog:/mnt/data/cassandra/commitlog\n"
            sb << "      - ./${n.name}/saved_caches:/mnt/data/cassandra/saved_caches\n"
            sb << "    healthcheck:\n"
            sb << "      test: [\"CMD-SHELL\", \"bash -c 'echo > /dev/tcp/127.0.0.1/7104' || exit 1\"]\n"
            sb << "      interval: 10s\n      timeout: 5s\n      start_period: 90s\n      retries: 30\n"
        }
        sb << "\nnetworks:\n  cass:\n    driver: bridge\n    ipam:\n      config:\n        - subnet: ${c.subnet}\n"

        file(c.composeFile).text = sb.toString()
        println "Rendered ${c.nodes.size()} node config(s) and ${c.composeFile}"
    }
}

tasks.register('cassRun', Exec) {
    description 'Build Cassandra + container image and start the local 3-node cluster'
    group 'local cluster'
    dependsOn 'jibDockerBuild', 'cassRenderConfigs'
    workingDir "${rootDir}/local"
    // down-then-up for a clean start: replacing a depended-on container in place can race
    // ("No such container" while node2/node3 wait on node1). Bind-mounted data survives `down`.
    commandLine 'sh', '-c',
        'docker compose -f cluster-compose.yml down --remove-orphans 2>/dev/null; ' +
        'docker compose -f cluster-compose.yml up -d'
    doLast {
        def c = project.ext.localCluster
        println ''
        println 'Local cluster starting (linux/amd64 under emulation on Apple Silicon — give it a few minutes).'
        println 'Each node publishes native transport (cqlsh) and JMX (nodetool) on localhost:'
        c.nodes.eachWithIndex { n, idx ->
            println "  ${n.name} (${n.rack}):  cqlsh 127.0.0.1 ${7104 + idx}    nodetool -p ${7501 + idx}"
        }
        println '  e.g.  ./bin/nodetool -h 127.0.0.1 -p 7501 status'
        println '        ./bin/cqlsh 127.0.0.1 7104'
        println '  logs: docker compose -f local/cluster-compose.yml logs -f'
        println '  stop: ./gradlew cassStop      (wipe data: ./gradlew cassClean)'
    }
}

tasks.register('cassStop', Exec) {
    description 'Stop the local cluster (keeps per-node data on disk)'
    group 'local cluster'
    workingDir "${rootDir}/local"
    commandLine 'docker', 'compose', '-f', 'cluster-compose.yml', 'down'
    ignoreExitValue true
}

tasks.register('cassClean') {
    description 'Stop the local cluster and delete per-node data/commitlog/saved_caches'
    group 'local cluster'
    dependsOn 'cassStop'
    doLast {
        // Cassandra runs as root in-container, so data files are root-owned on the host;
        // remove them from a throwaway container (reuses the already-built image).
        exec {
            commandLine 'docker', 'run', '--rm', '--entrypoint', 'sh',
                        '-v', "${rootDir}/local:/local", 'cde-nfcassandra:latest',
                        '-c', 'rm -rf /local/node*/data/* /local/node*/commitlog/* /local/node*/saved_caches/* 2>/dev/null; true'
            ignoreExitValue true
        }
        println 'Wiped per-node data/commitlog/saved_caches.'
    }
}
